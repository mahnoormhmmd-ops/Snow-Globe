<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <title>Snowy Charm</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="mano">
         <h1>Snowy Charm!</h1>
        <p class="tagline">Shake this little globe to make your day a lot better!</p>   
        </header>
        <main>
            <section class="globe-card">
                <div class="globe" id="globe">
                    <img src="snowglobe.png" alt="A Snowglobe"/>
                </div>
                <button id="shake">Shake It!</button>
                <p class="message" id="message">Press the button and see what's for you today!</p>
            </section>
        </main>
        <footer>
            <p>Made by Mahnoor Muhammad, with love, sweat, and tears! :D</p>
        </footer>
        <script src="script.js"></script>
    </body>
</html>
